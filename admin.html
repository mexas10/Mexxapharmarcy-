<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Order Admin — Mexxa Pharmacy</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/mexas10/Mexxapharmarcy-/main/android-chrome-192x192.png">
<meta name="theme-color" content="#0f2a6e">
<style>
:root{
  --blue:#1a4fd6; --blue-dark:#0f2a6e; --blue-deeper:#091a4a; --blue-light:#eef4ff;
  --green:#15803d; --red:#dc2626; --amber:#d97706; --sky:#0369a1;
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f8fafd; --border:#e2e8f2;
  --text:#080f20; --muted:#4f6070;
  --radius-sm:10px; --radius:16px; --radius-lg:22px;
  --shadow-sm:0 1px 3px rgba(10,30,90,.05), 0 2px 8px rgba(10,30,90,.04);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding-bottom:40px;}
h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif;}

/* ── LOGIN ── */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(135deg,#060e24 0%,#0c1a42 60%,#0f2460 100%);}
.login-card{background:var(--surface);border-radius:var(--radius-lg);padding:32px 26px;max-width:340px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.35);}
.login-card h1{font-size:20px;color:var(--blue-deeper);margin-bottom:4px;}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:20px;}
.login-card input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-size:14.5px;margin-bottom:12px;font-family:inherit;}
.login-card button{width:100%;padding:13px;border:none;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:#fff;font-weight:800;font-size:14.5px;
  cursor:pointer;font-family:inherit;}
.login-err{color:var(--red);font-size:12.5px;margin-bottom:10px;display:none;font-weight:600;}

/* ── DASHBOARD ── */
#dashView{display:none;}
header{background:linear-gradient(135deg,#060e24 0%,#0c1a42 60%,#0f2460 100%);padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;
  box-shadow:0 8px 24px rgba(4,10,30,.3);}
header h1{color:#fff;font-size:16px;font-weight:800;}
header span{color:#9fb8ec;font-size:11.5px;}
.logout-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#dce8ff;
  padding:7px 12px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;}

.wrap{max-width:1000px;margin:0 auto;padding:18px 16px;}

.stats-row{display:flex;gap:10px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;}
.stat-card{flex:1;min-width:110px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;box-shadow:var(--shadow-sm);}
.stat-num{font-size:22px;font-weight:800;color:var(--blue-dark);}
.stat-label{font-size:11px;color:var(--muted);font-weight:600;}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.toolbar input, .toolbar select{padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-size:13.5px;font-family:inherit;background:var(--surface);}
.toolbar input{flex:1;min-width:160px;}
.refresh-btn{padding:10px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);
  font-weight:700;font-size:13px;cursor:pointer;color:var(--blue-dark);}

.order-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);padding:16px;margin-bottom:12px;}
.order-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px;}
.order-id{font-weight:800;color:var(--blue-dark);font-size:15px;}
.order-time{color:var(--muted);font-size:11.5px;}
.status-badge{padding:4px 11px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap;}
.status-badge.pending{background:#fff7ed;color:var(--amber);}
.status-badge.confirmed{background:#eff6ff;color:var(--blue);}
.status-badge.ready{background:#f0f9ff;color:var(--sky);}
.status-badge.outfordelivery{background:#faf5ff;color:#7e22ce;}
.status-badge.delivered{background:#f0fdf4;color:var(--green);}
.status-badge.cancelled{background:#fef2f2;color:var(--red);}

.order-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:13px;margin-bottom:12px;}
.order-grid .full{grid-column:1/-1;}
.order-grid label{display:block;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.3px;margin-bottom:2px;}
.order-grid .val{color:var(--text);word-break:break-word;}
.order-grid a.val{color:var(--blue);text-decoration:underline;}

.order-controls{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:12px;}
.order-controls select, .order-controls input{padding:9px 10px;border:1.5px solid var(--border);border-radius:9px;
  font-size:12.5px;font-family:inherit;flex:1;min-width:120px;}
.save-btn{padding:9px 14px;border:none;border-radius:9px;background:var(--blue-dark);color:#fff;
  font-weight:700;font-size:12.5px;cursor:pointer;}
.wa-mini{padding:9px 12px;border-radius:9px;background:#20b954;color:#fff;font-weight:700;font-size:12.5px;
  text-decoration:none;display:flex;align-items:center;gap:5px;}

.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="loginView">
  <div class="login-card">
    <h1>Mexxa Order Admin</h1>
    <p>Sign in to view and manage orders</p>
    <div class="login-err" id="loginErr">Incorrect password.</div>
    <input type="password" id="passwordInput" placeholder="Admin password" autocomplete="current-password">
    <button id="loginBtn">Sign In</button>
  </div>
</div>

<!-- ══ DASHBOARD ══ -->
<div id="dashView">
  <header>
    <div>
      <h1>Mexxa Orders</h1>
      <span id="lastRefreshed">Loading...</span>
    </div>
    <button class="logout-btn" id="logoutBtn">Sign Out</button>
  </header>

  <div class="wrap">
    <div class="stats-row" id="statsRow"></div>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search by order ID, name, or phone...">
      <select id="statusFilter">
        <option value="">All Statuses</option>
        <option value="Pending">Pending</option>
        <option value="Confirmed">Confirmed</option>
        <option value="Ready">Ready</option>
        <option value="OutForDelivery">Out for Delivery</option>
        <option value="Delivered">Delivered</option>
        <option value="Cancelled">Cancelled</option>
      </select>
      <select id="branchFilter">
        <option value="">All Branches</option>
        <option value="HW Mall, Kitintale">Kitintale</option>
        <option value="Shell Kitetika, Gayaza Road">Kitetika / Gayaza Rd</option>
      </select>
      <select id="sortOrder">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
      </select>
      <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
    </div>

    <div id="ordersList"></div>
  </div>
</div>

<script>
(function(){
  // ⚠️ REPLACE with your deployed Apps Script Web App URL (same one used in refill.html)
  const API_URL = "https://script.google.com/macros/s/AKfycbyF1wqCuMDzsdyelE384uK9mNPXqP4oX1MVjuZYB7uPbUmN2TXx1bWTQX6JZgAhARAdtw/exec";
  const WA_NUMBER = "256766528078";
  const TOKEN_KEY = "mexxa_admin_token";

  let allOrders = [];

  function statusClass(s){ return (s || "pending").toLowerCase().replace(/\s+/g,""); }

  /* ── AUTH ── */
  function getToken(){ return sessionStorage.getItem(TOKEN_KEY); }
  function setToken(t){ sessionStorage.setItem(TOKEN_KEY, t); }
  function clearToken(){ sessionStorage.removeItem(TOKEN_KEY); }

  document.getElementById("loginBtn").addEventListener("click", login);
  document.getElementById("passwordInput").addEventListener("keydown", e => { if (e.key === "Enter") login(); });

  async function login(){
    const password = document.getElementById("passwordInput").value;
    const errEl = document.getElementById("loginErr");
    errEl.style.display = "none";
    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "login", password }) });
      const data = await res.json();
      if (data.ok) {
        setToken(data.token);
        showDashboard();
      } else {
        errEl.textContent = data.error || "Incorrect password.";
        errEl.style.display = "block";
      }
    } catch (err) {
      errEl.textContent = "Couldn't reach the server. Check your connection.";
      errEl.style.display = "block";
    }
  }

  document.getElementById("logoutBtn").addEventListener("click", () => {
    clearToken();
    document.getElementById("dashView").style.display = "none";
    document.getElementById("loginView").style.display = "flex";
  });

  function showDashboard(){
    document.getElementById("loginView").style.display = "none";
    document.getElementById("dashView").style.display = "block";
    loadOrders();
  }

  /* ── LOAD ── */
  async function loadOrders(){
    document.getElementById("lastRefreshed").textContent = "Refreshing...";
    try {
      const res = await fetch(`${API_URL}?action=list&token=${encodeURIComponent(getToken())}`);
      const data = await res.json();
      if (data.error === "unauthorized") { clearToken(); location.reload(); return; }
      allOrders = data.orders || [];
      renderStats();
      renderOrders();
      document.getElementById("lastRefreshed").textContent =
        "Updated " + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    } catch (err) {
      document.getElementById("lastRefreshed").textContent = "Couldn't load orders — try refresh";
    }
  }

  document.getElementById("refreshBtn").addEventListener("click", loadOrders);
  document.getElementById("searchInput").addEventListener("input", renderOrders);
  document.getElementById("statusFilter").addEventListener("change", renderOrders);
  document.getElementById("branchFilter").addEventListener("change", renderOrders);
  document.getElementById("sortOrder").addEventListener("change", renderOrders);

  function renderStats(){
    const counts = {};
    allOrders.forEach(o => { counts[o.status] = (counts[o.status] || 0) + 1; });
    const labels = ["Pending","Confirmed","Ready","OutForDelivery","Delivered","Cancelled"];
    const niceLabel = { OutForDelivery: "Out for Delivery" };
    document.getElementById("statsRow").innerHTML =
      `<div class="stat-card"><div class="stat-num">${allOrders.length}</div><div class="stat-label">Total Orders</div></div>` +
      labels.map(l => `<div class="stat-card"><div class="stat-num">${counts[l]||0}</div><div class="stat-label">${niceLabel[l]||l}</div></div>`).join("");
  }

  function renderOrders(){
    const search = document.getElementById("searchInput").value.toLowerCase();
    const statusF = document.getElementById("statusFilter").value;
    const branchF = document.getElementById("branchFilter").value;
    const sort = document.getElementById("sortOrder").value;

    let filtered = allOrders.filter(o => {
      const matchesSearch = !search ||
        (o.orderId||"").toLowerCase().includes(search) ||
        (o.customerName||"").toLowerCase().includes(search) ||
        (o.phone||"").toLowerCase().includes(search);
      const matchesStatus = !statusF || o.status === statusF;
      const matchesBranch = !branchF || o.branch === branchF;
      return matchesSearch && matchesStatus && matchesBranch;
    });

    filtered.sort((a,b) => {
      const ta = new Date(a.timestamp).getTime(), tb = new Date(b.timestamp).getTime();
      return sort === "oldest" ? ta - tb : tb - ta;
    });

    const list = document.getElementById("ordersList");
    if (!filtered.length) {
      list.innerHTML = `<div class="empty-state">No orders match your filters.</div>`;
      return;
    }

    list.innerHTML = filtered.map(o => renderOrderCard(o)).join("");

    filtered.forEach(o => {
      const saveBtn = document.getElementById("save-" + o.orderId);
      if (saveBtn) saveBtn.addEventListener("click", () => saveOrder(o.orderId));
    });
  }

  function renderOrderCard(o){
    const sc = statusClass(o.status);
    const time = o.timestamp ? new Date(o.timestamp).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : "";
    const estVal = o.estimatedDelivery ? (isNaN(new Date(o.estimatedDelivery)) ? "" : new Date(o.estimatedDelivery).toISOString().split("T")[0]) : "";
    const waMsg = encodeURIComponent(`Hi ${o.customerName || ""}, this is Mexxa Pharmacy regarding your order ${o.orderId}.`);

    return `
    <div class="order-card">
      <div class="order-top">
        <div>
          <div class="order-id">${o.orderId}</div>
          <div class="order-time">${time}</div>
        </div>
        <span class="status-badge ${sc}">${o.status}</span>
      </div>
      <div class="order-grid">
        <div><label>Customer</label><div class="val">${o.customerName || "—"}</div></div>
        <div><label>Phone</label><div class="val">${o.phone || "—"}</div></div>
        <div><label>Branch</label><div class="val">${(o.branch||"").replace(", Kitintale","").replace(", Gayaza Road","")}</div></div>
        <div><label>Method</label><div class="val">${o.deliveryMethod || "—"}</div></div>
        ${o.address ? `<div class="full"><label>Address</label><div class="val">${o.address}</div></div>` : ""}
        ${o.items ? `<div class="full"><label>Items</label><div class="val">${o.items}</div></div>` : ""}
        ${o.prescriptionUrl ? `<div class="full"><label>Prescription</label><a class="val" href="${o.prescriptionUrl}" target="_blank" rel="noopener">View Photo →</a></div>` : ""}
        ${o.notes ? `<div class="full"><label>Notes</label><div class="val">${o.notes}</div></div>` : ""}
      </div>
      <div class="order-controls">
        <select id="status-${o.orderId}">
          ${["Pending","Confirmed","Ready","OutForDelivery","Delivered","Cancelled"].map(s =>
            `<option value="${s}" ${o.status===s?"selected":""}>${s==="OutForDelivery"?"Out for Delivery":s}</option>`).join("")}
        </select>
        <input type="date" id="est-${o.orderId}" value="${estVal}">
        <button class="save-btn" id="save-${o.orderId}">Save</button>
        <a class="wa-mini" href="https://wa.me/${WA_NUMBER}?text=${waMsg}" target="_blank" rel="noopener">💬 WhatsApp</a>
      </div>
    </div>`;
  }

  async function saveOrder(orderId){
    const status = document.getElementById("status-" + orderId).value;
    const estimatedDelivery = document.getElementById("est-" + orderId).value;
    const btn = document.getElementById("save-" + orderId);
    btn.textContent = "Saving..."; btn.disabled = true;
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "updateOrder", token: getToken(), orderId, status, estimatedDelivery })
      });
      const data = await res.json();
      if (data.ok) { btn.textContent = "Saved ✓"; loadOrders(); }
      else { btn.textContent = "Failed"; }
    } catch (err) {
      btn.textContent = "Failed";
    }
    setTimeout(() => { btn.textContent = "Save"; btn.disabled = false; }, 1500);
  }

  /* ── INIT ── */
  if (getToken()) { showDashboard(); }
})();
</script>

</body>
</html>
