<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Order Admin — Mexxa Pharmacy</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/mexas10/Mexxapharmarcy-/main/android-chrome-192x192.png">
<meta name="theme-color" content="#0f2a6e">
<style>
:root{
  --blue:#1a4fd6; --blue-dark:#0f2a6e; --blue-deeper:#091a4a; --blue-light:#eef4ff;
  --green:#15803d; --red:#dc2626; --amber:#d97706; --sky:#0369a1;
  --bg:#eef1f8; --surface:#ffffff; --surface-2:#f8fafd; --border:#e4e9f3;
  --text:#0a1226; --muted:#5b6b80;
  --radius-sm:12px; --radius:18px; --radius-lg:24px;
  --shadow-sm:0 1px 2px rgba(15,42,110,.04), 0 4px 14px rgba(15,42,110,.05);
  --shadow-md:0 4px 12px rgba(15,42,110,.06), 0 14px 34px rgba(15,42,110,.08);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding-bottom:40px;
  background-image:radial-gradient(ellipse 70% 30% at 50% 0%, rgba(26,79,214,.05) 0%, transparent 70%);}
h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif;}

/* ── LOGIN ── */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse 90% 60% at 50% -10%, rgba(58,110,230,.35) 0%, transparent 60%),
    linear-gradient(160deg,#060e24 0%,#0c1a42 55%,#0f2460 100%);}
.login-card{background:var(--surface);border-radius:var(--radius-lg);padding:36px 28px;max-width:340px;width:100%;
  box-shadow:0 30px 80px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.06);position:relative;}
.login-card::before{content:'💊';display:flex;align-items:center;justify-content:center;width:52px;height:52px;
  border-radius:16px;background:var(--blue-light);font-size:24px;margin-bottom:16px;}
.login-card h1{font-size:21px;color:var(--blue-deeper);margin-bottom:4px;font-weight:800;}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:22px;}
.login-card input{width:100%;padding:14px 15px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-size:14.5px;margin-bottom:14px;font-family:inherit;background:var(--surface-2);transition:border-color .2s;}
.login-card input:focus{outline:none;border-color:var(--blue);background:#fff;}
.login-card button{width:100%;padding:14px;border:none;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:#fff;font-weight:800;font-size:14.5px;
  cursor:pointer;font-family:inherit;box-shadow:0 8px 24px rgba(26,79,214,.35);transition:transform .15s;}
.login-card button:active{transform:scale(.98);}
.login-err{color:var(--red);font-size:12.5px;margin-bottom:10px;display:none;font-weight:600;
  background:#fef2f2;padding:9px 12px;border-radius:10px;}

/* ── DASHBOARD ── */
#dashView{display:none;}
header{background:radial-gradient(ellipse 80% 100% at 20% 0%, rgba(58,110,230,.3) 0%, transparent 60%),
    linear-gradient(155deg,#060e24 0%,#0c1a42 60%,#0f2460 100%);
  padding:18px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;
  box-shadow:0 8px 28px rgba(4,10,30,.35);}
header h1{color:#fff;font-size:17px;font-weight:800;letter-spacing:-.2px;}
header span{color:#a9c0f2;font-size:11.5px;font-weight:500;}
.logout-btn{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);color:#e2ecff;
  padding:8px 14px;border-radius:11px;font-size:12px;font-weight:700;cursor:pointer;transition:background .2s;}
.logout-btn:active{background:rgba(255,255,255,.18);}

.wrap{max-width:1000px;margin:0 auto;padding:20px 16px;}

.stats-row{display:flex;gap:10px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;
  scrollbar-width:none;}
.stats-row::-webkit-scrollbar{display:none;}
.stats-row-secondary{margin-bottom:18px;}
.stat-card{flex:1;min-width:112px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 15px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--blue),var(--sky));opacity:.7;}
.stat-icon{font-size:15px;margin-bottom:4px;opacity:.85;}
.stat-num{font-size:23px;font-weight:800;color:var(--blue-dark);font-family:'Plus Jakarta Sans',sans-serif;
  letter-spacing:-.5px;}
.stat-label{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;
  margin-top:2px;}
.stat-card.stat-total{background:linear-gradient(155deg,var(--blue-dark),var(--blue));}
.stat-card.stat-total::before{display:none;}
.stat-card.stat-total .stat-num, .stat-card.stat-total .stat-label{color:#fff;}
.stat-card.stat-total .stat-label{color:rgba(255,255,255,.8);}
.stat-card.stat-mini{min-width:96px;padding:12px 13px;}
.stat-card.stat-mini .stat-num{font-size:19px;}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;background:var(--surface);padding:10px;
  border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow-sm);}
.toolbar input, .toolbar select{padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-size:13.5px;font-family:inherit;background:var(--surface-2);transition:border-color .2s;}
.toolbar input:focus, .toolbar select:focus{outline:none;border-color:var(--blue);}
.toolbar input{flex:1;min-width:160px;}
.refresh-btn{padding:11px 16px;border-radius:var(--radius-sm);border:none;
  background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:#fff;
  font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 14px rgba(26,79,214,.25);
  transition:transform .15s;}
.refresh-btn:active{transform:scale(.97);}

.order-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);padding:18px;margin-bottom:14px;border-left:4px solid var(--border);
  transition:box-shadow .2s;}
.order-card:hover{box-shadow:var(--shadow-md);}
.order-card.s-pending{border-left-color:var(--amber);}
.order-card.s-confirmed{border-left-color:var(--blue);}
.order-card.s-ready{border-left-color:var(--sky);}
.order-card.s-outfordelivery{border-left-color:#7e22ce;}
.order-card.s-delivered{border-left-color:var(--green);}
.order-card.s-cancelled{border-left-color:var(--red);opacity:.7;}

.order-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:8px;}
.order-id{font-weight:800;color:var(--blue-dark);font-size:16px;font-family:'Plus Jakarta Sans',sans-serif;
  letter-spacing:-.2px;}
.order-time{color:var(--muted);font-size:11.5px;margin-top:1px;}
.status-badge{padding:5px 12px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap;
  box-shadow:0 1px 2px rgba(0,0,0,.04);}
.status-badge.pending{background:#fff7ed;color:var(--amber);}
.status-badge.confirmed{background:#eff6ff;color:var(--blue);}
.status-badge.ready{background:#f0f9ff;color:var(--sky);}
.status-badge.outfordelivery{background:#faf5ff;color:#7e22ce;}
.status-badge.delivered{background:#f0fdf4;color:var(--green);}
.status-badge.cancelled{background:#fef2f2;color:var(--red);}

.order-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font-size:13px;margin-bottom:14px;
  background:var(--surface-2);border-radius:14px;padding:13px 14px;}
.order-grid .full{grid-column:1/-1;}
.order-grid label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.4px;margin-bottom:3px;}
.order-grid .val{color:var(--text);word-break:break-word;font-weight:500;}
.order-grid a.val{color:var(--blue);text-decoration:none;font-weight:700;}
.order-grid a.val:active{text-decoration:underline;}

.order-controls{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:14px;}
.order-controls select, .order-controls input{padding:10px 11px;border:1.5px solid var(--border);border-radius:11px;
  font-size:12.5px;font-family:inherit;flex:1;min-width:120px;background:var(--surface-2);}
.save-btn{padding:10px 16px;border:none;border-radius:11px;background:linear-gradient(135deg,var(--blue-dark),var(--blue));
  color:#fff;font-weight:700;font-size:12.5px;cursor:pointer;box-shadow:0 4px 12px rgba(26,79,214,.25);}
.wa-mini{padding:10px 13px;border-radius:11px;background:linear-gradient(135deg,#16a34a,#20b954);color:#fff;
  font-weight:700;font-size:12.5px;text-decoration:none;display:flex;align-items:center;gap:5px;
  box-shadow:0 4px 12px rgba(32,185,84,.25);}


.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="loginView">
  <div class="login-card">
    <h1>Mexxa Order Admin</h1>
    <p>Sign in to view and manage orders</p>
    <div class="login-err" id="loginErr">Incorrect password.</div>
    <input type="password" id="passwordInput" placeholder="Admin password" autocomplete="current-password">
    <button id="loginBtn">Sign In</button>
  </div>
</div>

<!-- ══ DASHBOARD ══ -->
<div id="dashView">
  <header>
    <div>
      <h1>Mexxa Orders</h1>
      <span id="lastRefreshed">Loading...</span>
    </div>
    <button class="logout-btn" id="logoutBtn">Sign Out</button>
  </header>

  <div class="wrap">
    <div class="stats-row" id="statsRow"></div>
    <div class="stats-row stats-row-secondary" id="statsRowSecondary"></div>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search by order ID, name, or phone...">
      <select id="statusFilter">
        <option value="">All Statuses</option>
        <option value="Pending">Pending</option>
        <option value="Confirmed">Confirmed</option>
        <option value="Ready">Ready</option>
        <option value="OutForDelivery">Out for Delivery</option>
        <option value="Delivered">Delivered</option>
        <option value="Cancelled">Cancelled</option>
      </select>
      <select id="branchFilter">
        <option value="">All Branches</option>
        <option value="HW Mall, Kitintale">Kitintale</option>
        <option value="Shell Kitetika, Gayaza Road">Kitetika / Gayaza Rd</option>
      </select>
      <select id="sortOrder">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
      </select>
      <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
    </div>

    <div id="ordersList"></div>
  </div>
</div>

<script>
(function(){
  // ⚠️ REPLACE with your deployed Apps Script Web App URL (same one used in refill.html)
  const API_URL = "https://script.google.com/macros/s/AKfycby6jIkbslz6mFfyods7PEBB0DQcY1COpOCzoiOZE_qW_9_0o3yU64w3HiXvvf-GPQWg/exec";
  const WA_NUMBER = "256766528078";
  const TOKEN_KEY = "mexxa_admin_token";

  let allOrders = [];

  function statusClass(s){ return (s || "pending").toLowerCase().replace(/\s+/g,""); }

  /* ── AUTH ── */
  function getToken(){ return sessionStorage.getItem(TOKEN_KEY); }
  function setToken(t){ sessionStorage.setItem(TOKEN_KEY, t); }
  function clearToken(){ sessionStorage.removeItem(TOKEN_KEY); }

  document.getElementById("loginBtn").addEventListener("click", login);
  document.getElementById("passwordInput").addEventListener("keydown", e => { if (e.key === "Enter") login(); });

  async function login(){
    const password = document.getElementById("passwordInput").value;
    const errEl = document.getElementById("loginErr");
    errEl.style.display = "none";
    try {
      const res = await fetch(API_URL, { method: "POST", body: new URLSearchParams({ action: "login", password }) });
      const data = await res.json();
      if (data.ok) {
        setToken(data.token);
        showDashboard();
      } else {
        errEl.textContent = data.error || "Incorrect password.";
        errEl.style.display = "block";
      }
    } catch (err) {
      errEl.textContent = "Couldn't reach the server. Check your connection.";
      errEl.style.display = "block";
    }
  }

  document.getElementById("logoutBtn").addEventListener("click", () => {
    clearToken();
    document.getElementById("dashView").style.display = "none";
    document.getElementById("loginView").style.display = "flex";
  });

  function showDashboard(){
    document.getElementById("loginView").style.display = "none";
    document.getElementById("dashView").style.display = "block";
    loadOrders();
  }

  /* ── LOAD ── */
  async function loadOrders(){
    document.getElementById("lastRefreshed").textContent = "Refreshing...";
    try {
      const res = await fetch(`${API_URL}?action=list&token=${encodeURIComponent(getToken())}`);
      const data = await res.json();
      if (data.error === "unauthorized") { clearToken(); location.reload(); return; }
      allOrders = data.orders || [];
      renderStats();
      renderOrders();
      document.getElementById("lastRefreshed").textContent =
        "Updated " + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    } catch (err) {
      document.getElementById("lastRefreshed").textContent = "Couldn't load orders — try refresh";
    }
  }

  document.getElementById("refreshBtn").addEventListener("click", loadOrders);
  document.getElementById("searchInput").addEventListener("input", renderOrders);
  document.getElementById("statusFilter").addEventListener("change", renderOrders);
  document.getElementById("branchFilter").addEventListener("change", renderOrders);
  document.getElementById("sortOrder").addEventListener("change", renderOrders);

  function renderStats(){
    const counts = {};
    allOrders.forEach(o => { counts[o.status] = (counts[o.status] || 0) + 1; });

    const now = new Date();
    const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const startOfWeek = new Date(startOfToday); startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());

    let todayCount = 0, weekCount = 0, deliveryCount = 0, pickupCount = 0;
    const branchCounts = {};
    allOrders.forEach(o => {
      const t = new Date(o.timestamp);
      if (t >= startOfToday) todayCount++;
      if (t >= startOfWeek) weekCount++;
      if ((o.deliveryMethod || "").toLowerCase() === "delivery") deliveryCount++;
      else if ((o.deliveryMethod || "").toLowerCase() === "pickup") pickupCount++;
      const b = (o.branch || "Unknown").replace(", Kitintale", "").replace(", Gayaza Road", "");
      branchCounts[b] = (branchCounts[b] || 0) + 1;
    });

    const statusIcons = { Pending:"⏳", Confirmed:"✅", Ready:"📦", OutForDelivery:"🚚", Delivered:"🎉", Cancelled:"✕" };
    const niceLabel = { OutForDelivery: "Out for Delivery" };
    const labels = ["Pending","Confirmed","Ready","OutForDelivery","Delivered","Cancelled"];

    const statusCards =
      `<div class="stat-card stat-total"><div class="stat-icon">🧾</div><div class="stat-num">${allOrders.length}</div><div class="stat-label">Total Orders</div></div>` +
      labels.map(l => `<div class="stat-card"><div class="stat-icon">${statusIcons[l]}</div><div class="stat-num">${counts[l]||0}</div><div class="stat-label">${niceLabel[l]||l}</div></div>`).join("");

    const branchEntries = Object.entries(branchCounts).sort((a,b) => b[1]-a[1]);
    const branchCards = branchEntries.map(([name, count]) =>
      `<div class="stat-card stat-mini"><div class="stat-icon">🏬</div><div class="stat-num">${count}</div><div class="stat-label">${name}</div></div>`
    ).join("");

    const secondaryCards =
      `<div class="stat-card stat-mini"><div class="stat-icon">📅</div><div class="stat-num">${todayCount}</div><div class="stat-label">Today</div></div>` +
      `<div class="stat-card stat-mini"><div class="stat-icon">🗓️</div><div class="stat-num">${weekCount}</div><div class="stat-label">This Week</div></div>` +
      `<div class="stat-card stat-mini"><div class="stat-icon">🚚</div><div class="stat-num">${deliveryCount}</div><div class="stat-label">Delivery</div></div>` +
      `<div class="stat-card stat-mini"><div class="stat-icon">🏪</div><div class="stat-num">${pickupCount}</div><div class="stat-label">Pickup</div></div>` +
      branchCards;

    document.getElementById("statsRow").innerHTML = statusCards;
    document.getElementById("statsRowSecondary").innerHTML = secondaryCards;
  }

  function renderOrders(){
    const search = document.getElementById("searchInput").value.toLowerCase();
    const statusF = document.getElementById("statusFilter").value;
    const branchF = document.getElementById("branchFilter").value;
    const sort = document.getElementById("sortOrder").value;

    let filtered = allOrders.filter(o => {
      const matchesSearch = !search ||
        (o.orderId||"").toLowerCase().includes(search) ||
        (o.customerName||"").toLowerCase().includes(search) ||
        (o.phone||"").toLowerCase().includes(search);
      const matchesStatus = !statusF || o.status === statusF;
      const matchesBranch = !branchF || o.branch === branchF;
      return matchesSearch && matchesStatus && matchesBranch;
    });

    filtered.sort((a,b) => {
      const ta = new Date(a.timestamp).getTime(), tb = new Date(b.timestamp).getTime();
      return sort === "oldest" ? ta - tb : tb - ta;
    });

    const list = document.getElementById("ordersList");
    if (!filtered.length) {
      list.innerHTML = `<div class="empty-state">No orders match your filters.</div>`;
      return;
    }

    list.innerHTML = filtered.map(o => renderOrderCard(o)).join("");

    filtered.forEach(o => {
      const saveBtn = document.getElementById("save-" + o.orderId);
      if (saveBtn) saveBtn.addEventListener("click", () => saveOrder(o.orderId));
    });
  }

  function renderOrderCard(o){
    const sc = statusClass(o.status);
    const time = o.timestamp ? new Date(o.timestamp).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : "";
    const estVal = o.estimatedDelivery ? (isNaN(new Date(o.estimatedDelivery)) ? "" : new Date(o.estimatedDelivery).toISOString().split("T")[0]) : "";
    const waMsg = encodeURIComponent(`Hi ${o.customerName || ""}, this is Mexxa Pharmacy regarding your order ${o.orderId}.`);

    return `
    <div class="order-card s-${sc}">
      <div class="order-top">
        <div>
          <div class="order-id">${o.orderId}</div>
          <div class="order-time">${time}</div>
        </div>
        <span class="status-badge ${sc}">${o.status}</span>
      </div>
      <div class="order-grid">
        <div><label>Customer</label><div class="val">${o.customerName || "—"}</div></div>
        <div><label>Phone</label><div class="val">${o.phone || "—"}</div></div>
        <div><label>Branch</label><div class="val">${(o.branch||"").replace(", Kitintale","").replace(", Gayaza Road","")}</div></div>
        <div><label>Method</label><div class="val">${o.deliveryMethod || "—"}</div></div>
        ${o.address ? `<div class="full"><label>Address</label><div class="val">${o.address}</div></div>` : ""}
        ${o.items ? `<div class="full"><label>Items</label><div class="val">${o.items}</div></div>` : ""}
        ${o.prescriptionUrl ? `<div class="full"><label>Prescription</label><a class="val" href="${o.prescriptionUrl}" target="_blank" rel="noopener">View Photo →</a></div>` : ""}
        ${o.notes ? `<div class="full"><label>Notes</label><div class="val">${o.notes}</div></div>` : ""}
      </div>
      <div class="order-controls">
        <select id="status-${o.orderId}">
          ${["Pending","Confirmed","Ready","OutForDelivery","Delivered","Cancelled"].map(s =>
            `<option value="${s}" ${o.status===s?"selected":""}>${s==="OutForDelivery"?"Out for Delivery":s}</option>`).join("")}
        </select>
        <input type="date" id="est-${o.orderId}" value="${estVal}">
        <button class="save-btn" id="save-${o.orderId}">Save</button>
        <a class="wa-mini" href="https://wa.me/${WA_NUMBER}?text=${waMsg}" target="_blank" rel="noopener">💬 WhatsApp</a>
      </div>
    </div>`;
  }

  async function saveOrder(orderId){
    const status = document.getElementById("status-" + orderId).value;
    const estimatedDelivery = document.getElementById("est-" + orderId).value;
    const btn = document.getElementById("save-" + orderId);
    btn.textContent = "Saving..."; btn.disabled = true;
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: new URLSearchParams({ action: "updateOrder", token: getToken(), orderId, status, estimatedDelivery })
      });
      const data = await res.json();
      if (data.ok) { btn.textContent = "Saved ✓"; loadOrders(); }
      else { btn.textContent = "Failed"; }
    } catch (err) {
      btn.textContent = "Failed";
    }
    setTimeout(() => { btn.textContent = "Save"; btn.disabled = false; }, 1500);
  }

  /* ── INIT ── */
  if (getToken()) { showDashboard(); }
})();
</script>

</body>
</html>
